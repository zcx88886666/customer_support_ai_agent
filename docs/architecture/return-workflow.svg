<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1380" viewBox="0 0 1680 1380" role="img" aria-labelledby="title description">
<title id="title">ResolveAI return to simulated refund workflow</title>
<desc id="description">The customer asks or submits a confirmed return. The API verifies ownership and deterministic eligibility. Ineligible requests create support tickets. Warehouse receipt and inspection must pass. The server calculates a version-bound refund proposal. A supervisor approves it. Only a controlled worker rechecks database facts and writes one simulated refund ledger and audit event. Quantity, inspection, and proposal exceptions stop or create tickets.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#64748b" stroke-width="2"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#dc5a4c" stroke-width="2"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#059669" stroke-width="2"/></marker>
  <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0f766e" stroke-width="2"/></marker>
  <style>
    text { font-family: "Ubuntu Sans", "DejaVu Sans", Arial, sans-serif; fill: #15243b; }
    .heading { font-size: 38px; font-weight: 750; letter-spacing: -1px; }
    .subtitle { font-size: 18px; fill: #52637b; }
    .section { font-size: 17px; font-weight: 750; fill: #52637b; letter-spacing: 1.8px; }
    .card-title { font-size: 22px; font-weight: 750; }
    .small-title { font-size: 19px; font-weight: 750; }
    .body { font-size: 17px; fill: #334155; }
    .small { font-size: 15px; fill: #475569; }
    .label { font-size: 15px; font-weight: 700; fill: #52637b; }
    .white { fill: #ffffff; }
  </style>
</defs>
<rect width="1680" height="1380" fill="#f7f9fc"/>
<text x="50" y="63" class="heading" text-anchor="start">Return to simulated refund · workflow</text>
<text x="50" y="96" class="subtitle" text-anchor="start">Each write crosses a server-side gate; human decisions and SQL facts control the money path.</text>
<text x="50" y="137" class="section" text-anchor="start">ACTOR</text>
<text x="360" y="137" class="section" text-anchor="start">MAIN PATH</text>
<text x="1190" y="137" class="section" text-anchor="start">EXCEPTION / HUMAN PATH</text>
<path d="M740 250 V280" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 370 V400" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 490 V520" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 610 V640" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 730 V760" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 850 V880" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 970 V1000" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 1090 V1120" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1120 445 H1190" fill="none" stroke="#dc5a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<path d="M1120 685 H1190" fill="none" stroke="#dc5a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<path d="M1120 805 H1190" fill="none" stroke="#dc5a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<path d="M1120 1045 H1190" fill="none" stroke="#dc5a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<path d="M740 1210 V1248" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="360" y="160" width="760" height="90" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="360" y="160" width="7" height="90" rx="3" fill="#2563eb"/>
<text x="384" y="198" class="card-title" text-anchor="start">1  Customer asks or submits</text>
<text x="384" y="231" class="body" text-anchor="start">Chat may read facts; a return requires explicit confirmation.</text>
<rect x="360" y="280" width="760" height="90" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="360" y="280" width="7" height="90" rx="3" fill="#2563eb"/>
<text x="384" y="318" class="card-title" text-anchor="start">2  Identity and owned order</text>
<text x="384" y="351" class="body" text-anchor="start">API checks role, customer ownership, item, quantity, and reason.</text>
<rect x="360" y="400" width="760" height="90" rx="18" fill="#fffaf0" stroke="#d97706" stroke-width="2"/>
<rect x="360" y="400" width="7" height="90" rx="3" fill="#d97706"/>
<text x="384" y="438" class="card-title" text-anchor="start">3  Deterministic eligibility</text>
<text x="384" y="471" class="body" text-anchor="start">Delivery, policy window, exclusions, and paid order status.</text>
<rect x="360" y="520" width="760" height="90" rx="18" fill="#eafaf5" stroke="#059669" stroke-width="2"/>
<rect x="360" y="520" width="7" height="90" rx="3" fill="#059669"/>
<text x="384" y="558" class="card-title" text-anchor="start">4  Return request created</text>
<text x="384" y="591" class="body" text-anchor="start">Confirmed + eligible; idempotency key protects retries.</text>
<rect x="360" y="640" width="760" height="90" rx="18" fill="#fffaf0" stroke="#d97706" stroke-width="2"/>
<rect x="360" y="640" width="7" height="90" rx="3" fill="#d97706"/>
<text x="384" y="678" class="card-title" text-anchor="start">5  Warehouse records receipt</text>
<text x="384" y="711" class="body" text-anchor="start">Actual quantity and receipt time are checked.</text>
<rect x="360" y="760" width="760" height="90" rx="18" fill="#fffaf0" stroke="#d97706" stroke-width="2"/>
<rect x="360" y="760" width="7" height="90" rx="3" fill="#d97706"/>
<text x="384" y="798" class="card-title" text-anchor="start">6  Warehouse inspection</text>
<text x="384" y="831" class="body" text-anchor="start">A passing inspection is required for a proposal.</text>
<rect x="360" y="880" width="760" height="90" rx="18" fill="#fffaf0" stroke="#d97706" stroke-width="2"/>
<rect x="360" y="880" width="7" height="90" rx="3" fill="#d97706"/>
<text x="384" y="918" class="card-title" text-anchor="start">7  Server calculates proposal</text>
<text x="384" y="951" class="body" text-anchor="start">Amount and source versions come from PostgreSQL.</text>
<rect x="360" y="1000" width="760" height="90" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="360" y="1000" width="7" height="90" rx="3" fill="#7c3aed"/>
<text x="384" y="1038" class="card-title" text-anchor="start">8  Supervisor approves or rejects</text>
<text x="384" y="1071" class="body" text-anchor="start">Protected role action; approval is stored in SQL.</text>
<rect x="360" y="1120" width="760" height="90" rx="18" fill="#eafaf5" stroke="#059669" stroke-width="2"/>
<rect x="360" y="1120" width="7" height="90" rx="3" fill="#059669"/>
<text x="384" y="1158" class="card-title" text-anchor="start">9  Worker issues simulated refund</text>
<text x="384" y="1191" class="body" text-anchor="start">Recheck approval, versions, and balance; one ledger + audit.</text>
<rect x="1190" y="400" width="430" height="120" rx="18" fill="#fff1f0" stroke="#f6b6ae" stroke-width="2"/>
<rect x="1190" y="400" width="7" height="120" rx="3" fill="#dc5a4c"/>
<text x="1214" y="438" class="small-title" text-anchor="start">Policy exception or no delivery</text>
<text x="1214" y="471" class="body" text-anchor="start">One ticket; no return or refund.</text>
<text x="1214" y="496" class="body" text-anchor="start">Bad quantity / foreign order → error.</text>
<rect x="1190" y="640" width="430" height="100" rx="18" fill="#fff1f0" stroke="#f6b6ae" stroke-width="2"/>
<rect x="1190" y="640" width="7" height="100" rx="3" fill="#dc5a4c"/>
<text x="1214" y="678" class="small-title" text-anchor="start">Quantity mismatch</text>
<text x="1214" y="711" class="body" text-anchor="start">Exception ticket; no normal receipt/refund.</text>
<rect x="1190" y="760" width="430" height="100" rx="18" fill="#fff1f0" stroke="#f6b6ae" stroke-width="2"/>
<rect x="1190" y="760" width="7" height="100" rx="3" fill="#dc5a4c"/>
<text x="1214" y="798" class="small-title" text-anchor="start">Inspection failed</text>
<text x="1214" y="831" class="body" text-anchor="start">Linked ticket; no approved refund path.</text>
<rect x="1190" y="1000" width="430" height="100" rx="18" fill="#fff1f0" stroke="#f6b6ae" stroke-width="2"/>
<rect x="1190" y="1000" width="7" height="100" rx="3" fill="#dc5a4c"/>
<text x="1214" y="1038" class="small-title" text-anchor="start">Rejected or stale proposal</text>
<text x="1214" y="1071" class="body" text-anchor="start">No refund; a new proposal needs approval.</text>
<rect x="360" y="1248" width="760" height="88" rx="18" fill="#eafaf5" stroke="#86efac" stroke-width="2"/>
<rect x="360" y="1248" width="7" height="88" rx="3" fill="#059669"/>
<text x="384" y="1286" class="small-title" text-anchor="start">Customer sees the final status</text>
<text x="384" y="1319" class="small" text-anchor="start">The ledger is simulated; no payment provider is called.</text>
<rect x="50" y="165" width="250" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="50" y="165" width="7" height="115" rx="3" fill="#2563eb"/>
<text x="74" y="203" class="small-title" text-anchor="start">Customer</text>
<text x="74" y="236" class="body" text-anchor="start">chat or return form</text>
<rect x="50" y="650" width="250" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="50" y="650" width="7" height="115" rx="3" fill="#d97706"/>
<text x="74" y="688" class="small-title" text-anchor="start">Warehouse</text>
<text x="74" y="721" class="body" text-anchor="start">receipt + inspection</text>
<rect x="50" y="1005" width="250" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="50" y="1005" width="7" height="115" rx="3" fill="#7c3aed"/>
<text x="74" y="1043" class="small-title" text-anchor="start">Supervisor</text>
<text x="74" y="1076" class="body" text-anchor="start">human approval</text>
<rect x="50" y="1135" width="250" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="50" y="1135" width="7" height="115" rx="3" fill="#059669"/>
<text x="74" y="1173" class="small-title" text-anchor="start">Controlled worker</text>
<text x="74" y="1206" class="body" text-anchor="start">idempotent issuance</text>
<text x="50" y="1358" class="subtitle" text-anchor="start">Blue: request/evidence    Amber: rule or transaction gate    Purple: human approval    Green: recorded state    Coral: ticket or stop</text>
</svg>
