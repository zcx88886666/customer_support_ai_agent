<text x="884" y="461" class="body" text-anchor="start">Domain rules create returns, tickets, receipts, proposals, and decisions.</text>
<text x="884" y="486" class="body" text-anchor="start">SQL ownership, eligibility, approval, balance, and idempotency checks</text>
<text x="884" y="511" class="body" text-anchor="start">are authoritative; model output cannot approve or issue a refund.</text>
