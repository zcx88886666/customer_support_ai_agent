<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1100" viewBox="0 0 1680 1100" role="img" aria-labelledby="title description">
<title id="title">ResolveAI implemented system architecture</title>
<desc id="description">Users reach the Next.js web UI and FastAPI. Keycloak supplies OIDC identity. FastAPI calls a LangGraph coordinator and protected domain services. The agent uses read-only Commerce MCP and policy retrieval. PostgreSQL stores business truth; Redis and Celery run controlled background jobs. OpenRouter and Langfuse are optional external services.</desc>
