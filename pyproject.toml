[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "pydantic>=2.8,<3",
  "pyjwt[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "mcp>=1.20,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7"]
observability = ["opentelemetry-sdk>=1.35,<2", "opentelemetry-exporter-otlp>=1.35,<2", "langfuse>=4,<5"]

[tool.setuptools.packages.find]
where = ["apps/api", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api", "packages"]
